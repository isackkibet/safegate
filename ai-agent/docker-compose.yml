services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safegate
      POSTGRES_PASSWORD: safegate
      POSTGRES_DB: safegate
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safegate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://safegate:safegate@postgres:5432/safegate
      REDIS_URL: redis://redis:6379
      PORT: 4100
      JWT_SECRET: dev-secret-change-me
    ports:
      - "4100:4100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
